[project]
name = "automotive_seed"
authors = [
    { name = "Toyota ERP Clone contributors", email = "erp-team@hinode.example" }
]
description = "Deterministic synthetic reference data (small / standard / large profiles) for non-production sites"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "GPL-3.0-only" }
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and pinned by bench (infra/versions.env).
    # Synthetic history is generated under frozen time so "today" rules hold per simulated day.
    "freezegun~=1.5.5",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.53.0,<17.0.0"
erpnext = ">=16.52.1,<17.0.0"

[tool.ruff]
extend = "../../ruff.toml"
