# Reference tenant: the fictional Hinode Automotive Group (requirements §2).
# Applied idempotently by automotive_core.setup.tenant.apply("hinode").
# Organisation structure only — no transactions. Synthetic data comes from
# automotive_seed (non-production sites only).

