# Intercompany relationships: seller company -> buyer company
# Tax determination (finance_controls/taxes.py): a party's tax category picks the template of
# each document through Tax Rules, per company; '' is the rule for parties without a category.
# The "Japan Tax 10%" and "US ST 6%" templates are ERPNext's country defaults (consumption tax,
# state sales tax). Exports are zero-rated, US dealers buy for resale, and imports carry no
# tax on the supplier's invoice (import tax is settled at customs). The rates and rules are
# configuration: validate jurisdiction-specific compliance separately.
taxes:
  categories: [Domestic Taxable, Export Zero-rated, Resale Exempt, Import]
  templates:   # charge no tax; the document still records why
    - {title: Export Zero-rated, type: Sales, companies: [HAMJ, HPC]}
    - {title: Resale Exempt, type: Sales, companies: [HADNA]}
    - {title: Import, type: Purchase, companies: [HAMJ, HPC, HADNA]}
  rules:       # company -> tax type -> tax category -> template title
    HAMJ: &japan
      Sales: {Domestic Taxable: Japan Tax 10%, Export Zero-rated: Export Zero-rated, "": Japan Tax 10%}
      Purchase: {Domestic Taxable: Japan Tax 10%, Import: Import, "": Japan Tax 10%}
    HPC: *japan
    HADNA:
      Sales: {Domestic Taxable: US ST 6%, Resale Exempt: Resale Exempt, "": US ST 6%}
      Purchase: {Domestic Taxable: US ST 6%, Import: Import}
  party_defaults:   # new dealers, suppliers and intercompany parties (Automotive Settings > Taxes)
    - {party_type: Customer, company_country: Japan, party_country: Japan, tax_category: Domestic Taxable}
    - {party_type: Customer, company_country: Japan, tax_category: Export Zero-rated}
    - {party_type: Customer, company_country: United States, party_country: United States, tax_category: Resale Exempt}
    - {party_type: Supplier, company_country: Japan, party_country: Japan, tax_category: Domestic Taxable}
    - {party_type: Supplier, company_country: Japan, tax_category: Import}
    - {party_type: Supplier, company_country: United States, party_country: United States,
       tax_category: Domestic Taxable}
    - {party_type: Supplier, company_country: United States, tax_category: Import}

intercompany:
  - {seller: Hinode Powertrain Components, buyer: Hinode Automotive Manufacturing Japan}
  - {seller: Hinode Automotive Manufacturing Japan, buyer: Hinode Automotive Distribution North America}

segregation_of_duties:
  - {name: Buyer vs AP Clerk, a: Buyer, b: AP Clerk, enforcement: Block,
     rationale: "Whoever commits spend must not book or match the supplier invoice."}
  - {name: AP Clerk vs Treasury Approver, a: AP Clerk, b: Treasury Approver, enforcement: Block,
     rationale: "Payment preparation and payment release are separated."}
  - {name: Buyer vs Treasury Approver, a: Buyer, b: Treasury Approver, enforcement: Block,
     rationale: "A buyer must not release payments to suppliers."}
  - {name: IT Operator vs Treasury Approver, a: IT Operator, b: Treasury Approver, enforcement: Block,
     rationale: "Administrators must not approve payments."}
  - {name: Auditor vs AP Clerk, a: Auditor, b: AP Clerk, enforcement: Block,
     rationale: "Auditors stay independent of the processes they review."}
  - {name: Warehouse Clerk vs Quality Manager, a: Warehouse Clerk, b: Quality Manager, enforcement: Warn,
     rationale: "Quarantine release should be decided by someone who does not move the stock."}

# Approval policies for DocTypes that exist when the tenant is applied; amounts are in
# company currency. Other apps add theirs through the automotive_tenant_policies hook.
approval_policies:
  - name: Purchase Order Approval - JPY
    doctype: Purchase Order
    companies: [Hinode Automotive Manufacturing Japan, Hinode Powertrain Components]
    amount_field: base_grand_total
    steps:
      - {step: 1, name: Procurement review, role: Procurement Manager}
      - {step: 2, name: Plant director, role: Plant Director, min_amount: 10000000}
      - {step: 3, name: Executive, role: Automotive Executive, min_amount: 100000000}
  - name: Purchase Order Approval - USD
    doctype: Purchase Order
    companies: [Hinode Automotive Distribution North America]
    amount_field: base_grand_total
    steps:
      - {step: 1, name: Procurement review, role: Procurement Manager}
      - {step: 2, name: Plant director, role: Plant Director, min_amount: 75000}
      - {step: 3, name: Executive, role: Automotive Executive, min_amount: 750000}
  - name: Supplier Payment Release
    doctype: Payment Entry
    amount_field: base_paid_amount
    category_field: payment_type
    category_values: [Pay]
    steps:
      - {step: 1, name: Treasury first approval, role: Treasury Approver}
      - {step: 2, name: Treasury second approval, role: Treasury Approver}
      - {step: 3, name: Group controller, role: Group Controller, min_amount: 50000000}
  - name: Manual Journal Approval
    doctype: Journal Entry
    amount_field: total_debit
    category_field: voucher_type
    category_values: [Journal Entry, Inter Company Journal Entry]
    steps:
      - {step: 1, name: Group controller, role: Group Controller}
  - name: Period Close Approval
    doctype: Period Close Checklist
    steps:
      - {step: 1, name: Second controller review, role: Group Controller}
  - name: Account Provisioning
    doctype: User Provisioning Request
    steps:
      - {step: 1, name: IT security review, role: IT Operator}

# Singles applied by the tenant bootstrap (only the listed fields are managed).
settings:
  Stock Settings:
    enable_serial_and_batch_no_for_item: 1
    valuation_method: Moving Average
    enable_stock_reservation: 1
    allow_partial_reservation: 1
    allow_negative_stock: 0
    allow_internal_transfer_at_arms_length_price: 1
    # rejected lots are received into quarantine and blocked by a Quality Hold (jidoka);
    # ERPNext's hard stop would prevent recording the rejected quantity at all
    action_if_quality_inspection_is_rejected: Warn
    action_if_quality_inspection_is_not_submitted: Stop
    # pre-delivery inspection at the North American centre inspects vehicles already received
    allow_to_make_quality_inspection_after_purchase_or_delivery: 1
    # forward stores are replenished from reserve storage on on-hand stock (the daily run in
    # automotive_supply_chain.logistics.storage); ERPNext's projected-quantity reorder job
    # would wait for open purchase orders and raise duplicate requests
    auto_indent: 0
  Buying Settings:
    po_required: "Yes"
    pr_required: "Yes"
    # rate differences are governed by the three-way match tolerances (automotive_supply_chain)
    maintain_same_rate: 0
  Accounts Settings:
    # documents created by code get their tax template's rows too (taxes above); ERPNext allows
    # one automatic source only, and no item carries an Item Tax Template here
    add_taxes_from_item_tax_template: 0
    add_taxes_from_taxes_and_charges_template: 1
    # Hard ceiling on billing above the received value. Price variances beyond the
    # three-way-match tolerance (2%) already block the invoice until a procurement manager
    # accepts them (automotive_supply_chain); ERPNext refuses anything above this ceiling
    # even when accepted, which forces an order amendment instead.
    over_billing_allowance: 10
  Manufacturing Settings:
    backflush_raw_materials_based_on: BOM
    overproduction_percentage_for_work_order: 0
    # line capacity is planned by the plant schedule and the planning run (automotive_manufacturing);
    # ERPNext's workstation slot search would refuse job cards beyond its 30-day window
    disable_capacity_planning: 1
  System Settings:
    apply_strict_user_permissions: 1
    enable_password_policy: 1
    minimum_password_score: 3
    date_format: yyyy-mm-dd
    time_format: HH:mm:ss
    first_day_of_the_week: Monday

# Applied only when the tenant is bootstrapped with environment=production.
production_settings:
  System Settings:
    enable_two_factor_auth: 1
    two_factor_method: OTP App
    session_expiry: "08:00"
    allow_login_using_mobile_number: 0
    allow_login_using_user_name: 0
