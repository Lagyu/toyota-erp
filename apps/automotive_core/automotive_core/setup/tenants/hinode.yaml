group_name: Hinode Automotive Group
fiscal_years:
  - {year: FY2025, start: "2025-04-01", end: "2026-03-31"}
  - {year: FY2026, start: "2026-04-01", end: "2027-03-31"}
  - {year: FY2027, start: "2027-04-01", end: "2028-03-31"}
holiday_years: [2025, 2026, 2027]

companies:
