# Intercompany relationships: seller company -> buyer company
intercompany:
  - {seller: Hinode Powertrain Components, buyer: Hinode Automotive Manufacturing Japan}
  - {seller: Hinode Automotive Manufacturing Japan, buyer: Hinode Automotive Distribution North America}

segregation_of_duties:
  - {name: Buyer vs AP Clerk, a: Buyer, b: AP Clerk, enforcement: Block,
     rationale: "Whoever commits spend must not book or match the supplier invoice."}
  - {name: AP Clerk vs Treasury Approver, a: AP Clerk, b: Treasury Approver, enforcement: Block,
     rationale: "Payment preparation and payment release are separated."}
  - {name: Buyer vs Treasury Approver, a: Buyer, b: Treasury Approver, enforcement: Block,
     rationale: "A buyer must not release payments to suppliers."}
  - {name: IT Operator vs Treasury Approver, a: IT Operator, b: Treasury Approver, enforcement: Block,
     rationale: "Administrators must not approve payments."}
  - {name: Auditor vs AP Clerk, a: Auditor, b: AP Clerk, enforcement: Block,
     rationale: "Auditors stay independent of the processes they review."}
  - {name: Warehouse Clerk vs Quality Manager, a: Warehouse Clerk, b: Quality Manager, enforcement: Warn,
     rationale: "Quarantine release should be decided by someone who does not move the stock."}

# Approval policies for DocTypes that exist when the tenant is applied; amounts are in
# company currency. Other apps add theirs through the automotive_tenant_policies hook.
approval_policies:
  - name: Purchase Order Approval - JPY
    doctype: Purchase Order
    companies: [Hinode Automotive Manufacturing Japan, Hinode Powertrain Components]
    amount_field: base_grand_total
    steps:
      - {step: 1, name: Procurement review, role: Procurement Manager}
      - {step: 2, name: Plant director, role: Plant Director, min_amount: 10000000}
      - {step: 3, name: Executive, role: Automotive Executive, min_amount: 100000000}
  - name: Purchase Order Approval - USD
    doctype: Purchase Order
    companies: [Hinode Automotive Distribution North America]
    amount_field: base_grand_total
    steps:
      - {step: 1, name: Procurement review, role: Procurement Manager}
      - {step: 2, name: Plant director, role: Plant Director, min_amount: 75000}
      - {step: 3, name: Executive, role: Automotive Executive, min_amount: 750000}
  - name: Supplier Payment Release
    doctype: Payment Entry
    amount_field: base_paid_amount
    category_field: payment_type
    category_values: [Pay]
    steps:
      - {step: 1, name: Treasury first approval, role: Treasury Approver}
      - {step: 2, name: Treasury second approval, role: Treasury Approver}
      - {step: 3, name: Group controller, role: Group Controller, min_amount: 50000000}
  - name: Manual Journal Approval
    doctype: Journal Entry
    amount_field: total_debit
    category_field: voucher_type
    category_values: [Journal Entry, Inter Company Journal Entry]
    steps:
      - {step: 1, name: Group controller, role: Group Controller}
  - name: Account Provisioning
    doctype: User Provisioning Request
    steps:
      - {step: 1, name: IT security review, role: IT Operator}
