# TLS with Let's Encrypt certificates (HTTP-01 challenge on port 80), used instead of
# frappe_docker's compose.https.yaml: the same pinned Traefik on the edge network as the
# file-certificate mode, with the shared TLS options and security headers. Certificates
# are kept in the letsencrypt volume.
services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=8080
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.routers.frontend.rule=${SITES_RULE:?SITES_RULE not set}
      - traefik.http.routers.frontend.middlewares=hinode-headers@file

  proxy:
    image: ${TRAEFIK_IMAGE:?}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-hinode}_edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.underscoreHeadersStrategy=delete
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=180s
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - ${HTTP_PUBLISH_PORT:-80}:80
      - ${HTTPS_PUBLISH_PORT:-443}:443
    networks: [edge]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: { max-size: 20m, max-file: "5" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic/dynamic.yaml:ro
      - letsencrypt:/letsencrypt
    mem_limit: 256m

volumes:
  letsencrypt:
