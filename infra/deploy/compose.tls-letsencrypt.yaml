# TLS with Let's Encrypt certificates (HTTP-01 challenge on port 80), used instead of
# frappe_docker's compose.https.yaml: the same pinned Traefik on the edge network as the
# file-certificate mode, with the shared TLS options and security headers. Certificates
# are kept in the letsencrypt volume.
services:
  proxy:
    image: ${TRAEFIK_IMAGE:?}
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.underscoreHeadersStrategy=delete
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=180s
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Prometheus metrics (requests, certificate expiry) on an internal entrypoint, scraped
      # only when the monitoring overlay is enabled (compose.monitoring-proxy.yaml)
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.metrics.address=:8082
      - --log.level=INFO
      - --accesslog=true
    ports:
      - ${HTTP_PUBLISH_PORT:-80}:80
      - ${HTTPS_PUBLISH_PORT:-443}:443
    environment:
      SITES_RULE: ${SITES_RULE:?SITES_RULE not set}
    networks: [edge]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: { max-size: 20m, max-file: "5" }
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic/dynamic.yaml:ro
      - ./traefik/routes-letsencrypt.yaml:/etc/traefik/dynamic/routes.yaml:ro
      - letsencrypt:/letsencrypt
    mem_limit: 256m

volumes:
  letsencrypt:
