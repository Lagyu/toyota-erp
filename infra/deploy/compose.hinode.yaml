# Hinode production/staging override, applied on top of the pinned frappe_docker files:
#
#   frappe_docker/compose.yaml
#   frappe_docker/overrides/compose.mariadb.yaml        (+ compose.mariadb-secrets.yaml) \  DATASTORES=bundled
#   frappe_docker/overrides/compose.redis.yaml                                          /  (the default)
#   frappe_docker/overrides/compose.https.yaml          (Let's Encrypt)  or  compose.tls-files.yaml
#   infra/deploy/compose.hinode.yaml                    (this file)
#   infra/deploy/compose.datastores.yaml                (DATASTORES=bundled: MariaDB and Redis tuning)
#   infra/deploy/compose.monitoring.yaml                (optional)
#
# Assembled by scripts/deploy/compose.sh <environment>. It adds: the immutable application
# image, private networks (the database and Redis have no route out), resource limits,
# health checks, container hardening and the scheduled, encrypted off-host backup job.
# ClamAV: compose.clamav.yaml. SINGLETONS=0 leaves the scheduler and the cron service out
# (the application hosts of the high-availability option but one: high-availability.md).

x-app: &app
  image: ${CUSTOM_IMAGE:?set CUSTOM_IMAGE}:${CUSTOM_TAG:?set CUSTOM_TAG}
  pull_policy: ${PULL_POLICY:-missing}
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp:size=512m]
  logging: &logging
    driver: local
    options: { max-size: 20m, max-file: "5" }
  networks: [backend, egress]

# What the backup and restore-drill jobs need (scheduler, for scripts/deploy/upgrade.sh and
# manual runs; cron, for the schedules).
x-backup-jobs: &backup-jobs
  environment:
    SITE_NAME: ${SITE_NAME:?}
    RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY (off-host)}
    RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
    RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
    RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
    AWS_ACCESS_KEY_ID: ${RESTIC_AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${RESTIC_AWS_SECRET_ACCESS_KEY:-}
    DB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 30 17 * * *}
    RESTORE_DRILL_SCHEDULE: ${RESTORE_DRILL_SCHEDULE:-0 30 19 * * 6}
    # binary log shipping (point-in-time recovery between the nightly backups)
    BINLOG_SCHEDULE: ${BINLOG_SCHEDULE:-0 */5 * * * *}
  secrets: [restic_password, db_password]
  volumes:
    - ../../ops/backup:/opt/hinode/ops/backup:ro

x-site-health: &site-health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  configurator:
    <<: *app
    networks: [backend]

  backend:
    <<: *app
    environment:
      SITE_NAME: ${SITE_NAME:?}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # gunicorn takes the scheme from X-Forwarded-Proto (set by the TLS proxy, passed on by
      # the frontend's nginx) only from trusted addresses, by default 127.0.0.1: the frontend
      # is another container, so the session cookie would lack Secure and generated URLs would
      # say http. Port 8000 is reachable only on the stack's own networks; gunicorn 23 takes
      # single addresses or "*", not ranges.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      <<: *site-health
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$SITE_NAME\" http://127.0.0.1:8000/api/method/automotive_core.ops.health.live >/dev/null"]
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    cpus: ${BACKEND_CPUS:-4}
    pids_limit: 512

  frontend:
    <<: *app
    networks: [edge, backend]
    cap_drop: [ALL]
    environment:
      SITE_NAME: ${SITE_NAME:?}
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-0.0.0.0/0}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
    healthcheck:
      <<: *site-health
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$SITE_NAME\" http://127.0.0.1:8080/api/method/automotive_core.ops.health.live >/dev/null"]
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-1}

  websocket:
    <<: *app
    networks: [backend]
    healthcheck:
      <<: *site-health
      test: ["CMD", "node", "-e", "require('net').connect(9000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
    mem_limit: ${WEBSOCKET_MEM_LIMIT:-512m}
    cpus: 1

  # more workers per queue for a queue that keeps a backlog (ops/performance/capacity.md)
  queue-short:
    <<: *app
    command: bench worker --queue short,default
    deploy:
      replicas: ${QUEUE_SHORT_WORKERS:-1}
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}

  queue-long:
    <<: *app
    command: bench worker --queue long,default,short
    deploy:
      replicas: ${QUEUE_LONG_WORKERS:-1}
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}

  scheduler:
    <<: [*app, *backup-jobs]
    deploy:
      replicas: ${SINGLETONS:-1}
    mem_limit: 512m
    cpus: 1

  # The scheduled operations jobs (nightly off-host backup, weekly restore drill, binary log
  # shipping every 5 minutes), run in the stack by ops/backup/cron.py with the scheduler's
  # environment: no Docker socket (C-02).
  # Schedules are UTC, seconds first: 17:30 UTC = 02:30 JST; 19:30 UTC Saturday = Sunday 04:30 JST.
  cron:
    <<: [*app, *backup-jobs]
    # frappe_docker's services take theirs from its compose.yaml; this one is defined only here
    # (not in x-app: the one-shot configurator must keep on-failure, or its dependants wait forever)
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/hinode/ops/backup/cron.py"]
    deploy:
      replicas: ${SINGLETONS:-1}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - ../../ops/backup:/opt/hinode/ops/backup:ro
    mem_limit: 512m
    cpus: 1

networks:
  edge: {}
  backend:
    internal: true
  egress: {}

secrets:
  restic_password:
    file: ${RESTIC_PASSWORD_FILE:?set RESTIC_PASSWORD_FILE}
  # the database's administrator password (frappe_docker's compose.mariadb-secrets.yaml declares
  # it too, for the bundled MariaDB): site creation, backups and restores need it either way
  db_password:
    file: ${DB_PASSWORD_SECRETS_FILE:?set DB_PASSWORD_SECRETS_FILE}
