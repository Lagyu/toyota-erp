# TLS with operator-supplied certificates (internal CA or purchased), instead of
# frappe_docker's compose.https.yaml (Let's Encrypt). Certificates are read from
# ${TLS_CERT_DIR}: fullchain.pem + privkey.pem; Traefik reloads them on change.
services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=8080
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.rule=${SITES_RULE:?SITES_RULE not set}
      - traefik.http.routers.frontend.middlewares=hinode-headers@file

  proxy:
    image: ${TRAEFIK_IMAGE:?}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-hinode}_edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.underscoreHeadersStrategy=delete
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=180s
      # Prometheus metrics (requests, certificate expiry) on an internal entrypoint, scraped
      # only when the monitoring overlay is enabled (compose.monitoring-proxy.yaml)
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.metrics.address=:8082
      - --log.level=INFO
      - --accesslog=true
    ports:
      - ${HTTP_PUBLISH_PORT:-80}:80
      - ${HTTPS_PUBLISH_PORT:-443}:443
    networks: [edge]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: { max-size: 20m, max-file: "5" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic/dynamic.yaml:ro
      - ./traefik/certificates.yaml:/etc/traefik/dynamic/certificates.yaml:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/certs:ro
    mem_limit: 256m
