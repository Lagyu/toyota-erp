# Alert rules for the Hinode ERP stack. Thresholds are starting points for the 50/150
# user profiles (ops/runbooks/monitoring.md explains each alert and its first response).
groups:
  - name: erp-availability
    rules:
      - alert: ErpBackendDown
        expr: up{job="erp"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "ERP backend is not answering the metrics endpoint for 5 minutes"
      - alert: ErpSchedulerStalled
        expr: time() - max(erp_scheduler_last_job_timestamp_seconds) > 1800
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No scheduled job completed for 30 minutes (scheduler or workers down)"
      - alert: MariaDBDown
        expr: mysql_up == 0
        for: 2m
        labels: { severity: critical }
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }

  - name: erp-latency
    # server time per request (automotive_core.observability.timing); targets from the brief §7:
    # p95 list/detail responses <= 2 s, p95 form submissions <= 4 s
    rules:
      - alert: ErpReadLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le, kind) (rate(erp_http_request_duration_seconds_bucket{verb="read"}[10m])))
          > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 server time of {{ $labels.kind }} reads above 2 s for 15 minutes"
      - alert: ErpWriteLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le, kind) (rate(erp_http_request_duration_seconds_bucket{verb="write"}[10m])))
          > 4
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 server time of {{ $labels.kind }} submissions above 4 s for 15 minutes"

  - name: erp-assurance
    rules:
      - alert: ErpRestoreDrillFailed
        expr: max(erp_restore_drill_last_ok) == 0
        labels: { severity: critical }
        annotations:
          summary: "The last weekly restore drill failed: backups may not be restorable"
      - alert: ErpRestoreDrillStale
        expr: time() - max(erp_restore_drill_last_timestamp_seconds) > 8 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No restore drill for more than 8 days"
      - alert: ErpVirusScannerDown
        expr: max(erp_clamav_up) == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The upload virus scanner does not answer: new uploads stay unscanned (and unreadable when scanning is required)"
      - alert: ErpCertificateExpiringSoon
        expr: min(traefik_tls_certs_not_after) - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "A TLS certificate expires in less than 14 days"
      - alert: ErpCertificateExpiring
        expr: min(traefik_tls_certs_not_after) - time() < 3 * 86400
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "A TLS certificate expires in less than 3 days"

  - name: erp-work
    rules:
      - alert: ErpPlanningRunFailed
        expr: max(erp_planning_runs_failed) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A planning (MRP) run failed; its error is on the Planning Run"
      - alert: ErpQueueBacklog
        expr: max by (queue) (erp_queue_jobs) > 500
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Queue {{ $labels.queue }} has had more than 500 waiting jobs for 15 minutes"
      - alert: ErpFailedJobsGrowing
        expr: increase(sum(erp_queue_failed_jobs)[1h:]) > 20
        labels: { severity: warning }
      - alert: ErpOutboxDeadLetters
        expr: max(erp_outbox_messages{status="Dead Letter"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Partner messages exhausted their retries (Integration Outbound Message, Dead Letter)"
      - alert: ErpInboxFailures
        expr: max(erp_inbox_messages{status=~"Failed|Dead Letter"}) > 0
        for: 15m
        labels: { severity: warning }
      - alert: ErpAuditSealingBehind
        expr: max(erp_audit_unsealed_events) > 2000
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Audit events are not being sealed into the hash chain"
      - alert: ErpErrorLogSpike
        expr: max(erp_error_logs_24h) > 100
        labels: { severity: warning }

  - name: erp-data-protection
    rules:
      - alert: ErpBackupStale
        expr: time() - max(erp_backup_last_success_timestamp_seconds) > 26 * 3600
        labels: { severity: critical }
        annotations:
          summary: "No verified off-host backup for more than 26 hours"
      - alert: ErpBackupNeverRan
        expr: absent(erp_backup_last_success_timestamp_seconds)
        for: 30h
        labels: { severity: critical }
      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.15
        for: 10m
        labels: { severity: warning }
