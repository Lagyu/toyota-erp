# Continuous integration. Every job calls the same scripts a developer runs locally
# (scripts/ci/*.sh), so a red build reproduces with one command.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.14" }
      - run: ./scripts/ci/lint.sh

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.14" }
      - run: ./scripts/ci/unit.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.14" }
      - run: ./scripts/ci/audit.sh

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Integration tests on the pinned bench
        run: ./scripts/ci/integration.sh
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-logs
          path: .local/dev-state/logs/
          retention-days: 14

  image:
    needs: [integration, audit]
    runs-on: ubuntu-24.04
    # the first run after a generator change also builds the small reference dataset
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Build production and reference images
        run: |
          ./scripts/image/build.sh | tee .local-image.txt
          ./scripts/image/build.sh --reference | tee .local-image-reference.txt
      - name: SBOM and vulnerability scan
        run: ./scripts/ci/sbom.sh "$(tail -1 .local-image.txt)"
      - name: Production stack smoke test
        run: ./scripts/ci/smoke.sh "$(tail -1 .local-image.txt)"
      - name: Reference dataset cache (rebuilt only when the generator changes)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/reference
          key: reference-small-${{ hashFiles('apps/automotive_seed/**') }}
      - name: End-to-end journeys (reference image, small dataset)
        run: ./scripts/ci/e2e.sh "$(tail -1 .local-image-reference.txt)"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-evidence
          path: |
            .local/sbom/
            .local/e2e/
            .local/smoke/
          retention-days: 30
      - name: Push release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./scripts/image/build.sh --push "ghcr.io/${{ github.repository_owner }}/hinode-erp"
