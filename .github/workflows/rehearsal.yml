# Production rehearsal (GATE-6): on a fresh hosted runner, install a previous release by
# the install runbook with TLS, monitoring and an S3 backup repository, upgrade it to this
# commit with scripts/deploy/upgrade.sh, then check HTTPS, a simulated reboot, an off-host
# backup, the restore drill and monitoring (scripts/ci/rehearsal.sh). Beside it: the
# Let's Encrypt mode against an ACME test server, a real reboot and power loss of a VM
# installed by the runbook, and the high-availability option's application tier (two hosts
# behind a load balancer, one failing). The reports are the run's summary and its artifacts.
name: rehearsal

on:
  workflow_dispatch:
    inputs:
      # releases from d7662a7 up to (not including) 0062cc2 cannot start: their one-shot
      # configurator restarts after it exits (the first start fails after 15 minutes)
      previous:
        description: Git ref of the previous release (empty = 25 commits before this one)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build the previous release's image
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          ref=${PREVIOUS:-$(git rev-parse HEAD~25)}
          git worktree add --detach .local/previous "$ref"
          (cd .local/previous && ./scripts/image/build.sh) | tee .local/previous-image.txt
      - name: Build this commit's image
        run: ./scripts/image/build.sh | tee .local/image.txt
      - name: Rehearsal
        run: ./scripts/ci/rehearsal.sh .local/previous "$(tail -1 .local/previous-image.txt)" "$(tail -1 .local/image.txt)"
      - name: Report
        if: always()
        run: if [[ -f .local/rehearsal/report.md ]]; then cat .local/rehearsal/report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: .local/rehearsal/
          include-hidden-files: true
          retention-days: 90

  # TLS_MODE=letsencrypt, which the main rehearsal (TLS from files) does not use: the proxy
  # obtains the site's certificate from an ACME test server (scripts/ci/acme-check.sh)
  acme:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build this commit's image
        run: ./scripts/image/build.sh | tee .local-image.txt
      - name: Let's Encrypt mode against Pebble
        run: ./scripts/ci/acme-check.sh "$(tail -1 .local-image.txt)"
      - name: Report
        if: always()
        run: if [[ -f .local/acme/report.md ]]; then cat .local/acme/report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acme
          path: .local/acme/
          include-hidden-files: true
          retention-days: 90

  # a real reboot, which a hosted runner cannot do to itself: this commit installed by the
  # runbook in an Ubuntu VM under KVM, rebooted, then reset like a power loss, with the
  # runbook's checks after each (scripts/ci/reboot-check.sh)
  reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build this commit's image
        run: ./scripts/image/build.sh | tee .local-image.txt
      - name: Reboot and power loss of a VM
        run: ./scripts/ci/reboot-check.sh "$(tail -1 .local-image.txt)"
      - name: Report
        if: always()
        run: if [[ -f .local/reboot/report.md ]]; then cat .local/reboot/report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reboot
          path: .local/reboot/
          include-hidden-files: true
          retention-days: 90

  # the high-availability option's application tier: two application hosts on external
  # datastores and shared storage behind a health-checking load balancer, the singleton host
  # failing (scripts/ci/ha-check.sh)
  ha:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build this commit's image
        run: ./scripts/image/build.sh | tee .local-image.txt
      - name: Two application hosts, one failing
        run: ./scripts/ci/ha-check.sh "$(tail -1 .local-image.txt)"
      - name: Report
        if: always()
        run: if [[ -f .local/ha/report.md ]]; then cat .local/ha/report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha
          path: .local/ha/
          include-hidden-files: true
          retention-days: 90
